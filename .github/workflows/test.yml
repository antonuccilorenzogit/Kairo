# Runs the automated tests on every push and pull request.
name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controllo sintassi dell'app
        run: for f in worker/public/*.js worker/src/*.js; do node --check "$f"; done
      - name: Test del server
        working-directory: worker
        run: npm test
